# .github/workflows/docker-ci.yml
name: Build & Push Images + Deploy to EC2

on:
  push:
    branches: [ "main" ]          # main에 푸시될 때
    tags: [ "v*", "release-*" ]   # 릴리즈 태그 푸시
  workflow_dispatch:              # 수동 실행

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: redis
            context: .
            file: Dockerfile.redis
            image: udd43/et-agent-redis
          - name: postgres
            context: .
            file: Dockerfile.postgres
            image: udd43/et-agent-postgres
          - name: postgres-init
            context: .
            file: Dockerfile.postgres
            image: udd43/et-agent-postgres-init
          - name: auth
            context: .
            file: Dockerfile.auth.slim
            image: udd43/et-agent-auth
          - name: langgraph
            context: .
            file: Dockerfile
            image: udd43/et-agent-langgraph
          - name: bff
            context: .
            file: Dockerfile.api.slim
            image: udd43/et-agent-bff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Deploy over SSH (pull & up -d --no-build)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "[*] Ensure docker is running"
            sudo systemctl start docker
            echo "[*] Docker login to Docker Hub"
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            echo "[*] Pull latest images & restart compose (no local build)"
            cd "${{ secrets.DEPLOY_DIR }}"
            sudo docker compose pull
            sudo docker compose up -d --pull always --no-build
            sudo docker compose ps
