version: '3.8'

services:
  # FastAPI 서버
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=REDACTED}
      - OPENAI_LLM_MODEL=${OPENAI_LLM_MODEL:-moonshotai/kimi-k2-instruct}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LANGCHAIN_API_KEY=REDACTED}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./api:/app/api
      - ./main.py:/app/main.py
      - ./teacher:/app/teacher
      - ./common:/app/common
      - ./farmer:/app/farmer
    networks:
      - et-agent-network
    restart: unless-stopped

  # # Redis (기존)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - et-agent-network
  #   restart: unless-stopped

  # # PostgreSQL (기존)
  # postgres:
  #   image: postgres:16
  #   environment:
  #     - POSTGRES_DB=langgraph
  #     - POSTGRES_USER=langgraph
  #     - POSTGRES_PASSWORD=langgraph
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - et-agent-network
  #   restart: unless-stopped

  # Nginx (로드 밸런서)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - et-agent-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  et-agent-network:
    driver: bridge


