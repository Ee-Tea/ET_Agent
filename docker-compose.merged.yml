#
# AUTO-MERGED docker-compose (sources: docker-compose.yml, docker-compose.api.yml, docker-compose.override.yml)
# This file preserves settings from the above files with later files overriding earlier ones.
# Edit build.dockerfile paths per-service if needed:
#   Available Dockerfiles in this upload: Dockerfile, Dockerfile.api, Dockerfile.auth

volumes:
  langgraph-data:
    driver: local
  redis_data: null
  postgres_data: null

services:

  redis:
    image: redis:7.2
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 1s
      retries: 5
    ports:
    - 6380:6379
    command: redis-server --appendonly no
    volumes:
    - ./data/redis:/data

  postgres-init:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: |
      sh -c "
        # PostgresSaver 테이블 생성
        psql -U postgres -d postgres -c \"
          CREATE TABLE IF NOT EXISTS checkpoints (
            thread_id TEXT PRIMARY KEY,
            checkpoint_id TEXT NOT NULL,
            parent_checkpoint_id TEXT,
            checkpoint_ns TEXT,
            checkpoint JSONB,
            metadata JSONB,
            created_at TIMESTAMP DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS checkpoint_blobs (
            thread_id TEXT,
            checkpoint_id TEXT,
            channel TEXT,
            version TEXT,
            type TEXT,
            blob BYTEA,
            created_at TIMESTAMP DEFAULT NOW(),
            PRIMARY KEY (thread_id, checkpoint_id, channel, version)
          );
        \"
      "
    depends_on:
      - langgraph-postgres

  langgraph-postgres:
    image: postgres:16
    ports:
    - 5433:5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
    - langgraph-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile.auth.slim
    ports:
    - 8124:8000
    depends_on:
      langgraph-postgres:
        condition: service_healthy
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
      PYTHONPATH: /deps/LLM-T
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/auth/health', timeout=2).read(); print('ok')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  langgraph-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - 8123:8000
    depends_on:
      redis:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy
      - postgres-init
    env_file:
    - .env
    environment:
      REDIS_URI: redis://redis:6379/0
      LANGSMITH_API_KEY=REDACTED}
      POSTGRES_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
      MILVUS_HOST: ${MILVUS_HOST:-standalone}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_COLLECTION: problems
      PYTHONPATH: /deps/LLM-T
      LANGGRAPH_GRAPHS: '[{"id":"agent","import_path":"graph:graph"}]'
      RUN_IN_CONTAINER: '1'
      REDIS_DEBUG: 'false'
      DATABASE_URL: postgresql+psycopg://postgres:postgres@langgraph-postgres:5432/postgres
    volumes:
    - ./:/deps/LLM-T:rw

  bff-api:
    build:
      context: .
      dockerfile: Dockerfile.api.slim
    ports:
    - 8000:8000
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - OPENAI_API_KEY=REDACTED}
    - OPENAI_LLM_MODEL=${OPENAI_LLM_MODEL:-moonshotai/kimi-k2-instruct}
    - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
    - LANGCHAIN_API_KEY=REDACTED}
    - GIT_PYTHON_REFRESH=quiet
    - LANGGRAPH_API_BASE=http://langgraph-api:8000
    depends_on:
    - redis
    - langgraph-postgres
    volumes:
    - ./api:/app/api
    - ./main.py:/app/main.py
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    - ./ssl:/etc/nginx/ssl
    depends_on:
    - bff-api
    restart: unless-stopped

networks:
  default:
    name: et-agent-network
    driver: bridge

