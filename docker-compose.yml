# AUTO-MERGED docker-compose (sources: docker-compose.yml, docker-compose.api.yml, docker-compose.override.yml)
# This file preserves settings from the above files with later files overriding earlier ones.
# Edit build.dockerfile paths per-service if needed:
#   Available Dockerfiles in this upload: Dockerfile, Dockerfile.api, Dockerfile.auth

volumes:
  langgraph-data:
    driver: local
  redis_data: null
  postgres_data: null

services:

  redis:
    image: redis:7.2
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 1s
      retries: 5
    ports:
    - 6380:6379
    command: redis-server --appendonly no
    volumes:
    - ./data/redis:/data

  postgres-init:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGHOST: langgraph-postgres
      PGPORT: 5432
    command: |
      sh -c "
        echo 'Waiting for PostgreSQL to be ready...'
        until pg_isready -h langgraph-postgres -p 5432 -U postgres; do
          echo 'PostgreSQL is unavailable - sleeping'
          sleep 2
        done
        echo 'PostgreSQL is up - executing command'
        
        # PostgresSaver 테이블 생성
        
        # 사용자/세션/메시지 테이블 생성 및 컬럼 보강
        psql -h langgraph-postgres -U postgres -d postgres -c \"
          CREATE TABLE IF NOT EXISTS users (
            user_id TEXT PRIMARY KEY,
            user_name TEXT,
            token TEXT,
            created_at TIMESTAMP DEFAULT NOW(),
            updated_at TIMESTAMP DEFAULT NOW()
          );
        \"

        psql -h langgraph-postgres -U postgres -d postgres -c \"
          CREATE TABLE IF NOT EXISTS chat_sessions (
            id SERIAL PRIMARY KEY,
            user_id TEXT NOT NULL,
            chat_id TEXT NOT NULL,
            session_id TEXT,
            title TEXT,
            session_data JSONB,
            metadata JSONB
            created_at TIMESTAMP DEFAULT NOW(),
            updated_at TIMESTAMP DEFAULT NOW(),
            is_active BOOLEAN DEFAULT TRUE,
            UNIQUE(user_id, chat_id)
          );
        \"

        psql -h langgraph-postgres -U postgres -d postgres -c \"
          ALTER TABLE chat_sessions ADD COLUMN IF NOT EXISTS session_id TEXT;
          ALTER TABLE chat_sessions ADD COLUMN IF NOT EXISTS title TEXT;
        \"

        psql -h langgraph-postgres -U postgres -d postgres -c \"
          CREATE TABLE IF NOT EXISTS chat_messages (
            id SERIAL PRIMARY KEY,
            user_id TEXT,
            chat_id TEXT NOT NULL,
            session_id TEXT,
            speaker TEXT,
            content TEXT NOT NULL,
            metadata JSONB,
            created_at TIMESTAMP DEFAULT NOW()
          );
        \"

        psql -h langgraph-postgres -U postgres -d postgres -c \"
          ALTER TABLE chat_messages ADD COLUMN IF NOT EXISTS session_id TEXT;
          ALTER TABLE chat_messages ADD COLUMN IF NOT EXISTS speaker TEXT;
        \"

        # 인덱스 생성
        psql -h langgraph-postgres -U postgres -d postgres -c \"
          CREATE INDEX IF NOT EXISTS idx_users_user_id ON users(user_id);
        \"

        psql -h langgraph-postgres -U postgres -d postgres -c \"
          CREATE INDEX IF NOT EXISTS idx_chat_sessions_user_id ON chat_sessions(user_id);
        \"

        psql -h langgraph-postgres -U postgres -d postgres -c \"
          CREATE INDEX IF NOT EXISTS idx_chat_sessions_session_id ON chat_sessions(session_id);
        \"

        psql -h langgraph-postgres -U postgres -d postgres -c \"
          CREATE INDEX IF NOT EXISTS idx_chat_messages_session_id ON chat_messages(session_id);
        \"
        
        echo 'Database initialization completed'
      "
    depends_on:
      langgraph-postgres:
        condition: service_healthy

  langgraph-postgres:
    image: postgres:16
    ports:
    - 5433:5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
    - langgraph-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile.auth.slim
    ports:
    - 8124:8000
    depends_on:
      langgraph-postgres:
        condition: service_healthy
    env_file:
    - .env
    environment:
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/auth/health', timeout=2).read(); print('ok')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
    - ./auth:/app/auth
    - ./alembic:/app/alembic
    - ./alembic.ini:/app/alembic.ini

  langgraph-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - 8123:8000
    depends_on:
      redis:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    env_file:
    - .env
    environment:
      REDIS_URI: redis://redis:6379/0
      LANGSMITH_API_KEY=REDACTED}
      PYTHONPATH: /deps/LLM-T
      LANGGRAPH_GRAPHS: '[{"id":"agent","import_path":"graph:graph"}]'
      RUN_IN_CONTAINER: '1'
      REDIS_DEBUG: 'false'
      # DATABASE_URL: postgresq://postgres:postgres@langgraph-postgres:5432/postgres
      DATABASE_URI: postgresql://postgres:postgres@langgraph-postgres:5432/postgres

    volumes:
    - ./:/deps/LLM-T:rw

  bff-api:
    build:
      context: .
      dockerfile: Dockerfile.api.slim
    ports:
    - 8100:8000
    env_file:
    - .env
    environment:
    - PYTHONPATH=/app
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_URL=redis://redis:6379
    - DATABASE_URI= postgresql://postgres:postgres@langgraph-postgres:5432/postgres
    - OPENAI_API_KEY=REDACTED}
    - OPENAI_LLM_MODEL=${OPENAI_LLM_MODEL:-moonshotai/kimi-k2-instruct}
    - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
    - LANGCHAIN_API_KEY=REDACTED}
    - GIT_PYTHON_REFRESH=quiet
    - LANGGRAPH_API_BASE=http://langgraph-api:8000
    - LANGGRAPH_API_URL=http://langgraph-api:8000
    volumes:
    - ./supervisor.py:/app/supervisor.py
    - ./teacher:/app/teacher
    - ./farmer:/app/farmer
    - ./common:/app/common
    - ./api:/app/api
    depends_on:
    - redis
    - langgraph-postgres
    - postgres-init
    - langgraph-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload 
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # orchestrator 서비스 제거 (BFF가 직접 실행)

  nginx:
    image: nginx:alpine
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    - ./ssl:/etc/nginx/ssl
    depends_on:
    - bff-api
    restart: unless-stopped

networks:
  default:
    name: et-agent-network
    driver: bridge

