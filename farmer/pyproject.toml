[project]
name = "eejang"
version = "0.1.0"
description = "농업 정보 제공 RAG 시스템 (작물 추천, 재해 대응, 판매 지원)"
authors = [
    { name = "ETRI", email = "etri@example.com" }
]
requires-python = "==3.12.*"

dependencies = [
    # --- 핵심 라이브러리 ---
    "numpy==1.26.4",
    "pandas>=2.2.2",
    "requests>=2.32.3",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "konlpy>=0.6.0",
    "spacy==3.7.5",
    "thinc==8.2.4",
    "blis==0.7.11",
    "markupsafe==2.1.5",
    "ko_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/ko_core_news_sm-3.7.0/ko_core_news_sm-3.7.0-py3-none-any.whl",
    "python-dateutil>=2.9.0",
    "docx2txt>=0.8",
    "tabulate>=0.9.0",
    # --- 기상 데이터 처리 ---
    "lxml>=5.0.0", # XML 파싱 (기상청 API 응답 처리)
    "chardet>=5.0.0", # 인코딩 감지 (기상청 API EUC-KR 처리)
    # --- 벡터 데이터베이스 ---
    "faiss-cpu>=1.8.0",
    "pymilvus>=2.4.0",

    # --- LangChain & LangGraph 생태계 ---
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.0.38",
    "langchain-huggingface>=0.0.3",
    "langchain-openai>=0.1.7",
    "langchain-google-genai>=1.0.3",
    "langchain-text-splitters>=0.0.1",
    "langchain-milvus>=0.1.0",
    "langgraph>=0.0.48",
    "langsmith>=0.1.17",
    "langchain-groq>=0.1.3",
    "langchain-tavily>=0.1.0",
    
    # --- LLM & 검색 API & 트랜스포머 ---
    "groq>=0.9.0",
    "tavily-python>=0.3.0",
    "wikipedia>=1.4.0",
    
    # --- 유효성 검사 & 데이터 모델 ---
    "pydantic>=2.0.0",
    "ragas==0.3.2", # ⬅️ extras 제거 (ragas[openai] → ragas)
    "datasets>=2.19.0", # ⬅️ Py3.12 호환 권장
    "pyarrow>=14,<17", # ⬅️ datasets와 호환 범위
    "openai>=1.30.0", # ⬅️ RAGAS(OpenAI) 백엔드용
    # --- 기상 전문가 시스템 전용 ---
    "sentence-transformers==2.7.0", # 임베딩 모델 (BAAI/bge-m3)
    "transformers==4.41.2", # HuggingFace 모델 로딩
    
    # --- PDF & 웹 스크레이핑 & OCR ---
    "pypdf>=4.2.0",
    "PyMuPDF>=1.24.1",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",  # bs4
    "easyocr>=1.7.0",
    "Pillow>=10.3.0",
    # --- PyTorch (CUDA 12.1, Windows, Python 3.12) ---
    "torch @ https://download.pytorch.org/whl/cu121/torch-2.5.1%2Bcu121-cp312-cp312-win_amd64.whl",
    "torchvision @ https://download.pytorch.org/whl/cu121/torchvision-0.20.1%2Bcu121-cp312-cp312-win_amd64.whl",
    "torchaudio @ https://download.pytorch.org/whl/cu121/torchaudio-2.5.1%2Bcu121-cp312-cp312-win_amd64.whl",

    # --- UI 프레임워크 & 시각화 ---
    "streamlit>=1.30.0",
    "gradio>=4.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # --- API 서버 (LangServe) ---
    "langserve>=0.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sales", "작물추천", "재배방법", "재해대응"]